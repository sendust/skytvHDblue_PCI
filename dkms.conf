PACKAGE_NAME="cx88-skytv"
PACKAGE_VERSION="1.0"

# Sources are cx88 from Linux v7.0 plus the SKYTV HD Blue patch; keep the
# build to 7.0.x kernels so a newer cx88 is never replaced by an older one.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src clean"

BUILT_MODULE_NAME[0]="cx88xx"
BUILT_MODULE_NAME[1]="cx8800"
BUILT_MODULE_NAME[2]="cx8802"
BUILT_MODULE_NAME[3]="cx88-alsa"
BUILT_MODULE_NAME[4]="cx88-blackbird"
BUILT_MODULE_NAME[5]="cx88-dvb"
BUILT_MODULE_NAME[6]="cx88-vp3054-i2c"

BUILT_MODULE_LOCATION[0]="src/"
BUILT_MODULE_LOCATION[1]="src/"
BUILT_MODULE_LOCATION[2]="src/"
BUILT_MODULE_LOCATION[3]="src/"
BUILT_MODULE_LOCATION[4]="src/"
BUILT_MODULE_LOCATION[5]="src/"
BUILT_MODULE_LOCATION[6]="src/"

DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
DEST_MODULE_LOCATION[3]="/updates/dkms"
DEST_MODULE_LOCATION[4]="/updates/dkms"
DEST_MODULE_LOCATION[5]="/updates/dkms"
DEST_MODULE_LOCATION[6]="/updates/dkms"

AUTOINSTALL="yes"
